# GPU (RTX 5090 / Blackwell) 升級版 compose
# 用法： docker compose -f docker-compose.gpu-cu128.yml up -d --build
services:
  manga_image_translator:
    build:
      context: .
      dockerfile: Dockerfile.cu128
    image: manga-image-translator:cu128
    container_name: manga_image_translator_gpu
    # 預設：只讓容器常駐，不自動啟動 web server。
    # translate.local.bat 只用 `docker exec`（不碰 port 5003），所以容器活著即可。
    # 這樣翻譯時 GPU 只有 CLI「一個」CUDA / GPU-PV 客戶端，避免 server 的常駐
    # `manga_translator shared` worker 多疊一個 context，降低 dxgkrnl 死結機率（見 crash-report.md）。
    entrypoint: ["tail", "-f", "/dev/null"]
    #
    # 想用網頁前端 (port 5003) 時，手動起 server（用完按 Ctrl+C 或重啟容器即可關掉）：
    #   docker exec -d manga_image_translator_gpu python server/main.py --verbose --start-instance --host=0.0.0.0 --port=5003 --use-gpu --nonce None
    #
    # 原本「容器一起來就自動跑 server」的設定保留在下面，要改回把上面 entrypoint 註解掉、解開這兩行即可：
    #   --nonce None 停用 nonce 檢查（這個映像的前端不送 X-Nonce，否則會 401: Nonce does not match）
    # entrypoint: python
    # command: server/main.py --verbose --start-instance --host=0.0.0.0 --port=5003 --use-gpu --nonce None
    volumes:
      - ./result:/app/result
      - ./server/main.py:/app/server/main.py
      - ./server/instance.py:/app/server/instance.py
      - ./server/index.html:/app/server/index.html
      # 用 host 上較新的 fork 程式碼覆蓋映像內的舊版（修正 max_tokens→max_completion_tokens 等）
      - ./manga_translator:/app/manga_translator
      # 讓 server 也能讀到本地 GPT config
      - ./gpt_config.local.yaml:/app/gpt_config.local.yaml
      # 用 host 上轉成繁體的 dict（glossary 等）覆蓋映像內的簡體版
      - ./dict:/app/dict
    ports:
      - 5003:5003
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
    # API key / 模型設定統一從 repo 根目錄的 .env 讀取
    env_file:
      - ./.env
